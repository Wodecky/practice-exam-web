<div #sentinel class="app-bar-sentinel" aria-hidden="true"></div>
<header class="app-bar" [class.app-bar-scrolled]="scrolled()">
  <div class="app-bar-inner">
    <a class="brand" routerLink="/" fragment="top" aria-label="Pracsis – strona główna">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <rect x="2" y="2" width="28" height="28" rx="9" fill="var(--md-sys-color-primary)" />
          <path
            d="M10 21 V11 H15 a4 4 0 0 1 0 8 H10"
            fill="none"
            stroke="var(--md-sys-color-on-primary)"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="22" cy="20" r="2" fill="var(--md-sys-color-tertiary-container)" />
        </svg>
      </span>
      <span class="brand-name">Pracsis</span>
    </a>

    <nav class="app-bar-nav" aria-label="Główna nawigacja">
      <a routerLink="/exams" routerLinkActive="active">Egzaminy</a>
      <a routerLink="/" fragment="how">Jak to działa</a>
      <a routerLink="/" fragment="try">Wypróbuj pytanie</a>
      <a routerLink="/" fragment="changelog">Dla developerów</a>
    </nav>

    <div class="app-bar-actions">
      <button
        mat-icon-button
        class="theme-toggle"
        [attr.aria-label]="isDark() ? 'Przełącz na tryb jasny' : 'Przełącz na tryb ciemny'"
        (click)="toggleTheme()"
      >
        <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-button class="sign-in-btn">Zaloguj się</button>
      <a mat-flat-button class="browse-btn" routerLink="/exams">
        <mat-icon>explore</mat-icon>
        Przeglądaj egzaminy
      </a>
      <button
        mat-icon-button
        class="menu-btn"
        #menuToggle
        [attr.aria-label]="menuOpen() ? 'Zamknij menu' : 'Otwórz menu'"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="app-bar-mobile-nav"
        (click)="toggleMenu()"
      >
        <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>

  <nav
    id="app-bar-mobile-nav"
    class="app-bar-mobile"
    [class.open]="menuOpen()"
    aria-label="Nawigacja mobilna"
    (click)="closeMenu()"
  >
    <a #firstMobileLink routerLink="/exams" routerLinkActive="active">Egzaminy</a>
    <a routerLink="/" fragment="how">Jak to działa</a>
    <a routerLink="/" fragment="try">Wypróbuj pytanie</a>
    <a routerLink="/" fragment="changelog">Dla developerów</a>
    <div class="app-bar-mobile-divider" aria-hidden="true"></div>
    <button mat-button class="mobile-action">Zaloguj się</button>
    <a mat-flat-button class="mobile-action" routerLink="/exams">
      <mat-icon>explore</mat-icon>
      Przeglądaj egzaminy
    </a>
  </nav>
</header>
